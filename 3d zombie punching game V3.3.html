        function levelUp() {
            player.level++; player.xp-=player.xpToNextLevel; player.xpToNextLevel=Math.floor(player.xpToNextLevel*1.5);
            currentSpawnDelay/=2; setSpawnInterval(); player.health=player.maxHealth;
            levelUpMessage.style.display='block'; setTimeout(() => { levelUpMessage.style.display='none'; }, 2000);
            
            for(let i=zombies.length-1; i>=0; i--) { 
                if (!zombies[i].isBoss) {
                    scene.remove(zombies[i].group); world.removeBody(zombies[i].body); zombies.splice(i, 1);
                }
            }

            let bossSpawned = false;
            for (let i = BOSS_RANKS.length - 1; i >= 0; i--) {
                if (player.level === BOSS_RANKS[i].level) {
                    spawnBoss(BOSS_RANKS[i]);
                    bossSpawned = true;
                    break;
                }
            }
            if (!bossSpawned && player.level > 30 && player.level % 5 === 0) {
                 spawnBoss(BOSS_RANKS[BOSS_RANKS.length - 1]);
            }

            showSkillChoiceScreen(); updateHUD();

        function equipSkill(id, i) { player.equippedSkills[i]=id; if(!player.skillLevels[id]) player.skillLevels[id]=1; player.skillCooldowns[i]=0; skillSlotEls[i].classList.remove('cooldown'); updateSkillHUD(); }

        function useSkill(i) {

                case 'heal':

                        player.health=Math.min(player.maxHealth, player.health+amt); updateHUD();

                                const kb=new CANNON.Vec3(); zombies[j].body.position.vsub(player.body.position, kb); kb.y=1; kb.normalize();
                                const kbForce = (zombies[j].isBoss ? 10 : 100); 
                                zombies[j].body.applyImpulse(kb.scale(kbForce), zombies[j].body.position);

                    setTimeout(() => {
                        createParticles(player.body.position, 0x00aaff, 50 + (lv * 15));

                                zombies[j].isFrozen=true; zombies[j].freezeUntil=gameTime+dur; setEntityColor(zombies[j].mesh, 0x00aaff);

            if(ok) { player.skillCooldowns[i]=gameTime + (s.baseCooldown - (s.id==='dash'?lv*200:0)); skillSlotEls[i].classList.add('cooldown'); }

        function updateActiveUltimates(dt) {

                  const z = zombies[i];

        function createParticles(pos, col, count) {
            const geo=new THREE.BufferGeometry(), verts=[]; for(let i=0; i<count; i++) verts.push(pos.x, pos.y+1, pos.z);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3));
            const mat=new THREE.PointsMaterial({color:col, size:0.3, transparent:true, opacity:1.0}), pts=new THREE.Points(geo,mat); scene.add(pts);
            const vels=[]; for(let i=0; i<count; i++) vels.push({x:(Math.random()-0.5)*8, y:(Math.random()-0.5)*8+4, z:(Math.random()-0.5)*8});
            let life=1.0; (function anim(){ life-=0.02; if(life<=0){ scene.remove(pts); return; } mat.opacity=life; const p=pts.geometry.attributes.position.array; for(let i=0; i<count; i++){ p[i*3]+=vels[i].x*0.016; p[i*3+1]+=vels[i].y*0.016; p[i*3+2]+=vels[i].z*0.016; vels[i].y-=0.2; } pts.geometry.attributes.position.needsUpdate=true; requestAnimationFrame(anim); })();
        }

        function openShop() {
             gamePaused = true; document.exitPointerLock();

        function checkAscensionUnlock() {
             // Requires all non-godly weapons, armor, and ultimates
             const w = normalWeapons.every(id => player.ownedItems[id]);
             const r = weaponRanks.rare.every(id => player.ownedItems[id]);
             const e = weaponRanks.epic.every(id => player.ownedItems[id]);
             const l = weaponRanks.legendary.every(id => player.ownedItems[id]);
             const m = weaponRanks.mythic.every(id => player.ownedItems[id]);
             const a = Object.keys(armors).every(id => player.ownedItems[id]);
             const u = Object.keys(ultimates).every(id => player.ownedItems[id]);
             return w && r && e && l && m && a && u || player.cheatsEnabled;
        }

        function closeShop() { resumeGame(); }
        window.switchShopTab = function(tab) {
             document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
             document.querySelectorAll('.shop-content').forEach(c => c.classList.remove('active'));
             document.querySelector(`.shop-tab[onclick="switchShopTab('${tab}')"]`).classList.add('active');
             const content = document.getElementById(`shop-${tab}`);
             content.classList.add('active');
             populateShop(tab, content);

        function populateShop(tab, container) {
             container.innerHTML = '';
             if (tab === 'weapons') {
                 // Exclude Godly from main tab
                 const keys = Object.keys(weapons).filter(k => weapons[k].rank !== 'godly');
                 keys.forEach(id => {
                      const item = weapons[id];
                      addItemToShop(container, id, item, player.ownedItems[id], () => buyWeapon(id));
                 });
             } else if (tab === 'armor') {
                 Object.keys(armors).forEach(id => {
                      const item = armors[id];
                      addItemToShop(container, id, item, player.ownedItems[id], () => buyArmor(id));
                 });
             } else if (tab === 'ultimates') {
                 Object.keys(ultimates).forEach(id => {
                      const item = ultimates[id];
                      const baseLevel = player.skillLevels[item.baseSkill] || 0;
                      const locked = !player.cheatsEnabled && baseLevel < 10;
                      addItemToShop(container, id, item, player.ownedItems[id], () => buyUltimate(id), locked, `Req: ${allSkills[item.baseSkill].name} Lv.10`);
                 });
             } else if (tab === 'upgrades') {
                 Object.keys(statUpgrades).forEach(key => {
                     const stat = statUpgrades[key];
                     const currentLevel = player.stats[key];
                     const cost = Math.floor(stat.baseCost * (1 + currentLevel * 0.5)); 
                     
                     const div = document.createElement('div'); 
                     div.className = `shop-item stat-upgrade-item`;
                     div.innerHTML = `<h4>${stat.name}</h4><span class="stat-level">Lv. ${currentLevel}</span><p>${stat.desc}</p><p>${cost} Coins</p>`;
                     const btn = document.createElement('button');
                     btn.innerText = 'Upgrade';
                     btn.disabled = player.coins < cost;
                     btn.onclick = () => buyStat(key, cost);
                     div.appendChild(btn); container.appendChild(div);
                 });
             } else if (tab === 'ascension') {
                 // Godly items
                 weaponRanks.godly.forEach(id => {
                      const item = weapons[id];
                      addItemToShop(container, id, item, player.ownedItems[id], () => buyWeapon(id));
                 });
             }
        }
        function addItemToShop(container, id, item, owned, buyFunc, locked=false, lockMsg='') {
             const div = document.createElement('div'); 
             div.className = `shop-item rarity-${item.rank || 'common'}`;
             div.innerHTML = `<h4>${item.name}</h4><p>${item.description || (item.passive ? `Passive: ${item.passive}` : `Dmg: ${item.damage}`)}</p><p>${locked ? lockMsg : `${item.price} Coins`}</p>`;
             const btn = document.createElement('button');
             btn.innerText = owned ? (isEquipped(id) ? 'Equipped' : 'Equip') : (locked ? 'Locked' : 'Buy');
             btn.disabled = locked || (!owned && player.coins < item.price) || isEquipped(id);
             if (isEquipped(id)) btn.classList.add('equipped');
             btn.onclick = () => { if (owned) equipItem(id); else buyFunc(); };
             div.appendChild(btn); container.appendChild(div);
        }
        function isEquipped(id) { return player.currentWeapon === id || player.currentArmor === id || player.equippedUltimate === id; }
        function equipItem(id) {
             if (weapons[id]) switchWeapon(id);
             if (armors[id]) { player.currentArmor = id; player.damageReduction = armors[id].reduction; armorNameEl.innerText = armors[id].name; }
             if (ultimates[id]) { player.equippedUltimate = id; updateSkillHUD(); }
             openShop(); 
        }
        function buyWeapon(id) { buyItem(id, weapons[id].price); }
        function buyArmor(id) { buyItem(id, armors[id].price); }
        function buyUltimate(id) { buyItem(id, ultimates[id].price); }
        function buyItem(id, price) {
             if (player.coins >= price) {
                  player.coins -= price; player.ownedItems[id] = true;
                  updateHUD(); openShop(); 
             }
        }
        
        function buyStat(key, cost) {
            if (player.coins >= cost) {
                player.coins -= cost;
                player.stats[key]++;
                
                const increment = statUpgrades[key].increment;
                
                if (key === 'health') {
                    player.maxHealth += increment;
                    player.health += increment; 
                } else if (key === 'attackSpeed') {
                    player.attackSpeedMultiplier += increment;
                } else if (key === 'moveSpeed') {
                    player.moveSpeedMultiplier += increment;
                } else if (key === 'damage') {
                    player.damageMultiplier += increment;
                }

                updateHUD();
                const content = document.getElementById(`shop-upgrades`);
                populateShop('upgrades', content);
                document.getElementById('shop-coin-count').innerText = `(${player.coins} Coins)`;
            }
        }

        // --- Cheat Console ---
        function toggleCheatConsole() {
             if (cheatConsole.style.display === 'block') {
                 resumeGame();
             } else {
                 gamePaused = true; document.exitPointerLock();
                 cheatConsole.style.display = 'block';
                 cheatInput.value = ''; cheatInput.focus();
             }
        }
        function processCheat() {
             const cmd = cheatInput.value;
             if (cmd === 'ccta690') {
                 player.coins += 1000000000;
                 player.cheatsEnabled = true; 
                 updateHUD(); resumeGame();
             } else if (cmd === '/ccta/1level') {
                 gainXP(player.xpToNextLevel - player.xp);
                 resumeGame();
             } else {
                 cheatInput.value = 'Invalid Code';
             }
        }

        window.restartGame = function() {
            player.health=player.maxHealth; player.isDead=false; player.level=1; player.xp=0; player.xpToNextLevel=100; player.ultimateCharge=0; player.coins=0;
            player.equippedSkills=[null,null,null,null]; player.skillLevels={}; player.skillCooldowns=[0,0,0,0]; player.attackSpeedMultiplier=1.0; player.damageReduction=0;
            player.damageMultiplier = 1; player.moveSpeedMultiplier = 1; player.stats = { health: 0, attackSpeed: 0, moveSpeed: 0, damage: 0 };
            player.body.position.set(0,5,0); player.body.velocity.set(0,0,0); player.dashUntil=0; currentSpawnDelay=5000;
            player.ownedItems={'fist_common':true}; player.currentArmor=null; player.equippedUltimate=null; player.cheatsEnabled=false; player.activeUltimates=[];
            player.ultimateAnim={active:false, type:null, time:0, duration:1.0};
            player.isFirstPerson=false;
            for(let i=zombies.length-1; i>=0; i--) { scene.remove(zombies[i].group); world.removeBody(zombies[i].body); } zombies=[];
            for(let i=projectiles.length-1; i>=0; i--) scene.remove(projectiles[i].mesh); projectiles=[];
            for(let i=persistentEffects.length-1; i>=0; i--) scene.remove(persistentEffects[i].mesh); persistentEffects=[];
            // Spectators are part of the colosseum, they don't need to be removed/re-added on restart
            messageBox.style.display='none'; levelUpMessage.style.display='none'; skillChoiceUI.style.display='none'; skillReplaceUI.style.display='none'; shopUI.style.display='none'; cheatConsole.style.display='none';
            bossHud.style.display='none'; bossActive=false; currentBoss=null;
            killCount=0; killCountEl.innerText='0'; player.currentWeapon=null; switchWeapon('fist_common'); updateHUD(); updateSkillHUD();
            armorNameEl.innerText = 'None';
            
            gamePaused=false; 
            try { canvas.requestPointerLock(); } catch(e) {} 
            lastTime=performance.now(); setSpawnInterval();
        }
        init();
    </script>
    </body>
</html>
