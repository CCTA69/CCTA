<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Roguelike Arena V3.3 - Godly Weapons Fix</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background-color: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: none;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            min-width: 300px;
        }
        .hud-item {
            margin-bottom: 10px;
        }
        .hud-item label {
            font-weight: bold;
            font-size: 1.1em;
            color: #eee;
            display: block;
            margin-bottom: 5px;
        }
        .bar-container {
            width: 100%;
            height: 20px;
            background-color: #555;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #222;
        }
        #player-health-bar {
            width: 100%;
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.3s ease;
        }
        #player-xp-bar {
            width: 0%;
            height: 100%;
            background-color: #3b82f6;
            transition: width 0.3s ease;
        }
        #ultimate-bar {
            width: 0%;
            height: 100%;
            background-color: #a855f7;
            transition: width 0.3s ease;
        }
        #skill-slots {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .skill-slot {
            width: 70px;
            height: 60px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            color: #888;
            padding: 2px;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.2;
            overflow: hidden;
        }
        .skill-slot .skill-key {
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
        }
        .skill-slot .skill-name {
            font-size: 0.85em;
            color: #ddd;
            white-space: nowrap;
        }
        .skill-slot .skill-level {
            font-size: 0.75em;
            color: #4CAF50;
        }
        .skill-slot.cooldown {
            background-color: #111;
        }
        .skill-slot.cooldown .skill-name, .skill-slot.cooldown .skill-level {
             color: #555;
        }
        #ultimate-slot {
             width: 80px; height: 70px; border-color: #a855f7;
        }
        #ultimate-slot .skill-key { color: #a855f7; }

        #boss-hud {
            display: none;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            z-index: 15;
        }
        #boss-name {
            text-align: center;
            display: block;
            font-size: 1.8em;
            color: #ff3300;
            font-weight: bold;
            text-shadow: 0 0 10px #000;
            margin-bottom: 5px;
        }
        #boss-health-container {
            height: 25px;
            border: 2px solid #500;
            background-color: #220000;
        }
        #boss-health-bar {
            width: 100%;
            height: 100%;
            background-color: #ff3300;
            transition: width 0.1s linear;
        }

        #message-box, #level-up-message {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 2em;
            font-weight: bold;
            display: none;
            z-index: 100;
            text-align: center;
        }
        #message-box { background-color: rgba(200, 0, 0, 0.8); }
        #level-up-message { 
            background-color: rgba(59, 130, 246, 0.9); 
            top: 40%; 
            font-size: 2.5em; 
            color: #fff; 
            border: 2px solid #fff; 
        }
        #game-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.2em;
            z-index: 10;
            text-align: center;
            width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #skill-choice-ui, #skill-replace-ui, #shop-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 900px;
            background-color: rgba(10, 10, 10, 0.98);
            border: 2px solid #555;
            border-radius: 10px;
            z-index: 200;
            display: none;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            max-height: 80vh;
            overflow-y: auto;
        }
        #skill-choice-ui h2, #skill-replace-ui h2, #shop-ui h2 {
            text-align: center;
            margin-top: 0;
            color: #ffc;
            font-size: 2em;
        }
        #skill-choice-options, #skill-replace-options {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .skill-choice-option {
            background-color: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            flex: 1 1 250px; 
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .skill-choice-option:hover {
            background-color: #333;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .skill-choice-option h3 {
            margin: 0 0 10px 0;
            font-size: 1.4em;
            color: #3b82f6;
        }
        .skill-choice-option .level-up-tag {
            color: #4CAF50;
            font-size: 0.8em;
            display: block;
            margin-top: -5px;
            margin-bottom: 10px;
        }
        .skill-choice-option .mastery-tag {
            color: #a855f7; 
            font-weight: bold;
            font-size: 0.9em;
            display: block;
            margin-top: 5px;
        }
        .skill-choice-option p {
            margin: 0;
            font-size: 0.95em;
            color: #ccc;
            min-height: 50px;
        }
        #skill-replace-ui h3 { color: #f44336; }
        .ui-btn {
            padding: 10px 30px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            font-size: 1.1em;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .ui-btn:hover { background: #444; }

        /* Shop Styles */
        #shop-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .shop-tab { padding: 10px 20px; background: #222; border: 1px solid #444; cursor: pointer; border-radius: 5px 5px 0 0; flex-grow: 1; text-align: center; }
        .shop-tab.active { background: #444; border-bottom-color: #444; font-weight: bold; color: #fff; }
        .shop-content { display: none; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .shop-content.active { display: grid; }
        .shop-item { background: #1a1a1a; border: 2px solid #333; padding: 15px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .shop-item h4 { margin: 0 0 10px 0; color: #eee; }
        .shop-item p { font-size: 0.9em; color: #aaa; flex-grow: 1; }
        .shop-item button { margin-top: 10px; padding: 8px; background: #4CAF50; border: none; color: white; cursor: pointer; border-radius: 4px; }
        .shop-item button:disabled { background: #555; cursor: not-allowed; }
        .shop-item button.equipped { background: #2196F3; }
        
        .stat-upgrade-item h4 { color: #ffd700; }
        .stat-level { color: #4CAF50; font-weight: bold; margin-bottom: 5px; display: block;}
        
        .rarity-common { border-color: #999; }
        .rarity-uncommon { border-color: #4CAF50; }
        .rarity-rare { border-color: #2196F3; }
        .rarity-epic { border-color: #9C27B0; }
        .rarity-legendary { border-color: #FF9800; }
        .rarity-mythic { border-color: #F44336; }
        
        /* NEW: Godly Rarity Style */
        .rarity-godly { 
            border-color: #00FFFF; 
            box-shadow: 0 0 10px #00FFFF; 
            animation: godlyPulse 3s infinite alternate; 
            background: linear-gradient(135deg, #1a1a1a 0%, #001133 100%);
        }
        .rarity-godly h4 {
            background: linear-gradient(to right, #00FFFF, #FF00FF, #FFFF00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        @keyframes godlyPulse { 
            0% { box-shadow: 0 0 10px #00FFFF; border-color: #00FFFF; } 
            50% { box-shadow: 0 0 20px #FF00FF; border-color: #FF00FF; } 
            100% { box-shadow: 0 0 10px #FFFF00; border-color: #FFFF00; } 
        }
        
        #cheat-console {
            position: absolute; top: 0; left: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.8); z-index: 1000; display: none;
        }
        #cheat-input {
            width: 90%; padding: 10px; font-size: 1.2em; background: #333; color: #0f0; border: 1px solid #555; font-family: monospace;
        }

    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="reticle"></div>

    <div id="hud">
        <div class="hud-item">
            <label>Health</label>
            <div class="bar-container"><div id="player-health-bar"></div></div>
        </div>
        <div class="hud-item">
            <label>XP (Level <span id="player-level">1</span>)</label>
            <div class="bar-container"><div id="player-xp-bar"></div></div>
        </div>
        <div class="hud-item">
            <label>Ultimate</label>
            <div class="bar-container"><div id="ultimate-bar"></div></div>
        </div>
        <div class="hud-item">
            <label>Skills</label>
            <div id="skill-slots">
                <div id="skill-slot-0" class="skill-slot"><span class="skill-key">Q</span><span class="skill-name">-</span><span class="skill-level"></span></div>
                <div id="skill-slot-1" class="skill-slot"><span class="skill-key">E</span><span class="skill-name">-</span><span class="skill-level"></span></div>
                <div id="skill-slot-2" class="skill-slot"><span class="skill-key">R</span><span class="skill-name">-</span><span class="skill-level"></span></div>
                <div id="skill-slot-3" class="skill-slot"><span class="skill-key">F</span><span class="skill-name">-</span><span class="skill-level"></span></div>
                <div id="ultimate-slot" class="skill-slot"><span class="skill-key">Z</span><span class="skill-name">Ultimate</span><span class="skill-level">-</span></div>
            </div>
        </div>
        <div class="hud-item"><label>Kills: <span id="kill-count">0</span></label></div>
        <div class="hud-item"><label>Coins: <span id="coin-count" style="color: gold;">0</span></label></div>
        <div class="hud-item"><label>Weapon: <span id="weapon-name">Fist</span></label></div>
        <div class="hud-item"><label>Armor: <span id="armor-name">None</span></label></div>
    </div>

    <div id="boss-hud">
        <label id="boss-name">BOSS RANK C</label>
        <div id="boss-health-container" class="bar-container">
            <div id="boss-health-bar"></div>
        </div>
    </div>

    <div id="message-box" onclick="restartGame()">YOU DIED<br><span style="font-size: 0.5em;">Click to Restart</span></div>
    <div id="level-up-message">LEVEL UP!</div>
    <div id="game-info">WASD: Move | SPACE: Attack | MOUSE: Look/Aim | 1, 2, 3: Weapons | Q, E, R, F: Skills | Z: Ultimate | B: Shop | P: Toggle View</div>

    <div id="skill-choice-ui">
        <h2>CHOOSE YOUR UPGRADE</h2>
        <div id="skill-choice-options"></div>
        <div style="text-align: center; margin-top: 20px;">
             <button id="skip-skill-btn" class="ui-btn">Skip</button>
        </div>
    </div>

    <div id="skill-replace-ui">
        <h2>REPLACE WHICH SKILL?</h2>
        <div id="skill-replace-options"></div>
        <div style="text-align: center; margin-top: 20px;">
             <button id="cancel-replace-btn" class="ui-btn">Cancel</button>
        </div>
    </div>

    <div id="shop-ui">
        <h2>SHOP <span id="shop-coin-count" style="color: gold; font-size: 0.8em;">(0 Coins)</span></h2>
        <div id="shop-tabs">
            <div class="shop-tab active" onclick="switchShopTab('weapons')">Weapons</div>
            <div class="shop-tab" onclick="switchShopTab('armor')">Armor</div>
            <div class="shop-tab" onclick="switchShopTab('ultimates')">Ultimates</div>
            <div class="shop-tab" onclick="switchShopTab('upgrades')">Upgrades</div>
            <div class="shop-tab" id="shop-tab-ascension" onclick="switchShopTab('ascension')" style="display:none; color: #00FFFF; border-color: #00FFFF; box-shadow: 0 0 5px #00FFFF;">ASCENSION</div>
        </div>
        <div id="shop-weapons" class="shop-content active"></div>
        <div id="shop-armor" class="shop-content"></div>
        <div id="shop-ultimates" class="shop-content"></div>
        <div id="shop-upgrades" class="shop-content"></div>
        <div id="shop-ascension" class="shop-content"></div>
        <div style="text-align: center; margin-top: 20px;">
             <button id="close-shop-btn" class="ui-btn">Close Shop</button>
        </div>
    </div>
    
    <div id="cheat-console">
        <input type="text" id="cheat-input" placeholder="Enter Cheat Code...">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script type="module">
        let scene, camera, renderer, world;
        let player = {
            mesh: null, body: null, cameraPivot: null,
            health: 100, maxHealth: 100, level: 1, xp: 0, xpToNextLevel: 100, coins: 0,
            equippedSkills: [null, null, null, null],
            skillLevels: {}, 
            skillCooldowns: [0, 0, 0, 0],
            equippedUltimate: null, ultimateCooldown: 0,
            ultimateCharge: 0, maxUltimateCharge: 100, isDead: false,
            attackCooldown: false, attackSpeedMultiplier: 1, damageReduction: 0,
            damageMultiplier: 1, moveSpeedMultiplier: 1,
            weaponMesh: null, currentWeapon: 'fist_common',
            dashUntil: 0, isMoving: false,
            isPhaseShifting: false, 
            hasBloodlust: false,    
            attackState: { active: false, time: 0, duration: 0.25, startRot: 0, startPos: new THREE.Vector3() },
            skillAnim: { active: false, type: null, time: 0, duration: 0.5 },
            ultimateAnim: { active: false, type: null, time: 0, duration: 1.0 }, 
            ownedItems: { 'fist_common': true }, 
            currentArmor: null,
            cheatsEnabled: false,
            activeUltimates: [],
            regenTimer: 0,
            isFirstPerson: false,
            stats: { health: 0, attackSpeed: 0, moveSpeed: 0, damage: 0 }
        };
        
        const RANKS = { common: 0, uncommon: 1, rare: 2, epic: 3, legendary: 4, mythic: 5, godly: 6 };

        const statUpgrades = {
            health: { name: 'Max Health', desc: '+15 Max HP', baseCost: 200, increment: 15 },
            attackSpeed: { name: 'Attack Speed', desc: '+5% Attack Speed', baseCost: 300, increment: 0.05 },
            moveSpeed: { name: 'Move Speed', desc: '+5% Move Speed', baseCost: 250, increment: 0.05 },
            damage: { name: 'Damage', desc: '+10% Damage', baseCost: 400, increment: 0.10 }
        };

        // --- MESH CREATION FUNCTIONS DEFINED BEFORE USAGE ---
        function createFistMesh() {
            const g = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color: 0x882222, roughness: 0.5 }); const geo = new THREE.SphereGeometry(0.18, 8, 8);
            const l = new THREE.Mesh(geo, mat); l.position.set(-0.35, 0, 0); g.add(l);
            const r = new THREE.Mesh(geo, mat); r.position.set(0.35, 0, 0); g.add(r);
            return g;
        }
        function createSwordMesh(color) {
            const g = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.3, 0.05), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.8, roughness: 0.2 })); b.position.y = 0.8; b.castShadow=true; g.add(b);
            const gd = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.15), new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.3 })); gd.position.y = 0.15; gd.castShadow=true; g.add(gd);
            const h = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.4, 0.08), new THREE.MeshStandardMaterial({ color: 0x553311, roughness: 0.8 })); h.position.y = -0.05; h.castShadow=true; g.add(h);
            return g;
        }
        function createKatanaMesh(color) {
            const g = new THREE.Group(); 
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.6, 0.08), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.9, roughness: 0.1 })); b.position.y = 0.9; b.rotation.x = 0.1; b.castShadow=true; g.add(b);
            const h = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8), new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 })); h.position.y = 0; h.castShadow=true; g.add(h);
            const gd = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.02, 16), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.5 })); gd.position.y = 0.25; g.add(gd);
            return g;
        }
        function createSpearMesh(color) {
            const g = new THREE.Group();
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.5, 8), new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.9 })); shaft.position.y = 1.0; shaft.castShadow=true; g.add(shaft);
            const tip = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.4, 4), new THREE.MeshStandardMaterial({ color: color, metalness: 0.8, roughness: 0.2 })); tip.position.y = 2.4; tip.castShadow=true; g.add(tip);
            return g;
        }
        function createBowMesh(color) {
             const g = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color: color || 0x8B4513, roughness: 0.6 });
             const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, -0.6, 0), new THREE.Vector3(0.4, 0, 0), new THREE.Vector3(0, 0.6, 0));
             const tube = new THREE.TubeGeometry(curve, 20, 0.05, 8, false);
             const bow = new THREE.Mesh(tube, mat); g.add(bow);
             const stringMat = new THREE.LineBasicMaterial({ color: 0xeeeeee });
             const stringGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.6, 0), new THREE.Vector3(0, 0.6, 0)]);
             const string = new THREE.Line(stringGeo, stringMat); g.add(string);
             return g;
        }
        function createGunMesh(color) {
            const g = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7, roughness: 0.3 });
            const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.6), mat); barrel.position.set(0, 0.1, 0.2); g.add(barrel);
            const handle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.15), new THREE.MeshStandardMaterial({color: color})); handle.position.set(0, -0.1, 0); handle.rotation.x = 0.3; g.add(handle);
            return g;
        }
        // --- NEW GODLY MESHES ---
        function createPrimordialKatanaMesh() {
            const g = new THREE.Group();
            // Blade: Beam of light
            const bladeGeo = new THREE.CylinderGeometry(0.05, 0.02, 1.8, 8);
            const bladeMat = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.8 });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 1.0; blade.rotation.x = 0.1;
            g.add(blade);
            
            // Golden Rings
            const ringGeo = new THREE.TorusGeometry(0.1, 0.02, 8, 16);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 1.0, roughness: 0.0 });
            for(let i=0; i<3; i++) {
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(0, 0.5 + i*0.4, 0);
                ring.rotation.x = Math.PI/2;
                g.add(ring);
            }
            
            // Hilt
            const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8), new THREE.MeshStandardMaterial({ color: 0xFFFFFF }));
            hilt.position.y = 0;
            g.add(hilt);
            return g;
        }

        function createFallenBowMesh() {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.8 });
            
            // Jagged limbs
            const limb1 = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.8, 4), mat);
            limb1.position.set(0, 0.5, 0); limb1.rotation.z = -0.5;
            g.add(limb1);
            const limb2 = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.8, 4), mat);
            limb2.position.set(0, -0.5, 0); limb2.rotation.z = 0.5; limb2.rotation.x = Math.PI;
            g.add(limb2);

            // Core
            const core = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({ color: 0xFF0000 }));
            g.add(core);

            // String (Laser)
            const stringMat = new THREE.LineBasicMaterial({ color: 0xFF0000 });
            const stringGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.8, 0), new THREE.Vector3(0, 0.8, 0)]);
            const string = new THREE.Line(stringGeo, stringMat); 
            g.add(string);
            return g;
        }

        const weapons = {

        function createColosseum() {
             const radius = 70, segments = 36, wallHeight = 6; 
             const wallMat = new THREE.MeshStandardMaterial({ color: 0xF5F5F5, roughness: 0.7 });
             const seatMat = new THREE.MeshStandardMaterial({ color: 0xEEEEEE, roughness: 0.9, side: THREE.DoubleSide }); 
             const goldMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8, roughness: 0.2 });

             for(let i=0; i<segments; i++) {
                  const angle = (i / segments) * Math.PI * 2;
                  const x = Math.sin(angle) * radius;
                  const z = Math.cos(angle) * radius;
                  const pos = new CANNON.Vec3(x, wallHeight/2, z);
                  const rotY = Math.atan2(x, z);
                  createWallSegment(pos, rotY, (Math.PI*2*radius)/segments + 1, wallHeight, wallMat);

                  if (i % 4 === 0) {
                       const laurel = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.3, 8, 16), goldMat);
                       laurel.position.set(x * 0.98, wallHeight - 2, z * 0.98);
                       laurel.lookAt(0, wallHeight - 2, 0);
                       scene.add(laurel);
                  }
             }
             
             for(let r=0; r<6; r++) { 
                  const currentRadius = radius + r * 4;
                  const nextRadius = radius + (r + 1) * 4;
                  const currentHeight = wallHeight + r * 2;
                  
                  const floorGeo = new THREE.RingGeometry(currentRadius, nextRadius, 48);
                  const floor = new THREE.Mesh(floorGeo, seatMat);
                  floor.rotation.x = -Math.PI / 2;
                  floor.position.y = currentHeight;
                  floor.receiveShadow = true;
                  scene.add(floor);

                  const riserGeo = new THREE.CylinderGeometry(nextRadius, nextRadius, 2, 48, 1, true);
                  const riser = new THREE.Mesh(riserGeo, seatMat);
                  riser.position.y = currentHeight + 1; 
                  riser.receiveShadow = true;
                  scene.add(riser);
                  
                  for(let s=0; s<35; s++) {
                       const angle = Math.random() * Math.PI * 2;
                       const rPos = currentRadius + 0.5 + Math.random() * (nextRadius - currentRadius - 1);
                       const sx = Math.sin(angle) * rPos;
                       const sz = Math.cos(angle) * rPos;
                       
                       const spec = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.8), new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }));
                       spec.position.set(sx, currentHeight + 0.8, sz);
                       spec.lookAt(0, 5, 0);
                       scene.add(spec);
                       spectators.push({ mesh: spec, baseY: currentHeight + 0.8, offset: Math.random() * Math.PI * 2 });
                  }
             }
        }
        function createWallSegment(pos, rotY, w, h, mat) {
            const b = new CANNON.Body({ mass: 0, material: groundMaterial });
            b.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, 1)));
            b.position.copy(pos);
            b.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), rotY);
            world.addBody(b);
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 2), mat);
            m.position.copy(pos);
            m.quaternion.copy(b.quaternion);
            m.castShadow=true; m.receiveShadow=true;
            scene.add(m);
        }

        function animate() {
            if (player.isDead && !gamePaused) gamePaused = true;
            if (gamePaused) { requestAnimationFrame(animate); return; }
            requestAnimationFrame(animate);
            const time = performance.now(), delta = (time - lastTime) / 1000.0; gameTime = time;
            world.step(1/60, delta);
            handlePlayerMovement(delta);
            updatePlayerAnimations(gameTime/1000, delta);
            
            if (player.currentArmor && armors[player.currentArmor].regen) {
                 player.regenTimer += delta;
                 if (player.regenTimer >= 1.0) {
                      player.health = Math.min(player.maxHealth, player.health + armors[player.currentArmor].regen);
                      player.regenTimer = 0; updateHUD();
                 }
            }

            spectators.forEach(s => {
                 s.mesh.position.y = s.baseY + Math.max(0, Math.sin(gameTime/200 + s.offset) * 0.2);
            });

            if (player.mesh) player.mesh.parent.position.copy(player.body.position);

            for (let i = zombies.length - 1; i >= 0; i--) {
                const z = zombies[i]; if (!z || !z.group || !z.body) continue;
                z.group.position.copy(z.body.position); z.group.quaternion.copy(z.body.quaternion);
                
                const dist = player.body.position.distanceTo(z.body.position);
                const attackRange = z.isBoss ? 1.5 * z.rank.scale : (z.equippedWeapon ? z.equippedWeapon.range * 0.8 : 1.5);

                if (z.isFrozen && gameTime > z.freezeUntil) { z.isFrozen = false; z.isBrittle = false; setEntityColor(z.mesh, z.isBoss ? z.rank.color : (z.isGolden ? 0xffd700 : 0x44cc44)); }
                
                if (!z.isFrozen) {
                    if (z.attackState === 'chase') {
                         const dir = new CANNON.Vec3(); player.body.position.vsub(z.body.position, dir); dir.y=0; dir.normalize();
                         z.body.velocity.set(dir.x * z.baseSpeed, z.body.velocity.y, dir.z * z.baseSpeed);
                         z.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), Math.atan2(dir.x, dir.z));
                         const s = 8 * (z.isBoss ? 0.5 : 1), a = Math.sin(gameTime/1000*s)*0.3;
                         if(z.mesh.getObjectByName('leftLeg')) z.mesh.getObjectByName('leftLeg').rotation.x=a;
                         if(z.mesh.getObjectByName('rightLeg')) z.mesh.getObjectByName('rightLeg').rotation.x=-a;
                         
                         if (!z.weaponMesh) {
                            if(z.mesh.getObjectByName('leftArm')) z.mesh.getObjectByName('leftArm').rotation.x=-a;
                            if(z.mesh.getObjectByName('rightArm')) z.mesh.getObjectByName('rightArm').rotation.x=a;
                         }

                         if (z.isBoss && gameTime > z.skillCooldown && dist < 30) { 
                             useBossSkill(z);
                             let cd = 12000 - (z.rank.level * 100); 
                             z.skillCooldown = gameTime + Math.max(5000, cd); 
                             z.attackState = 'skill'; 
                             z.attackTimer = gameTime + 2000; 
                         } else if (dist < attackRange) { 
                             z.attackState = 'windup';
                             z.attackTimer = gameTime + 500; 
                         }
                    } else if (z.attackState === 'skill') { 
                        if (gameTime > z.attackTimer) {
                            z.attackState = 'chase';
                        }
                    } else if (z.attackState === 'windup') {
                        z.body.velocity.set(0, z.body.velocity.y, 0); 
                        
                        if (z.weaponMesh) {
                            if (z.equippedWeapon.type === 'spear') z.weaponMesh.position.z = 0.5; 
                            else z.weaponMesh.rotation.x = Math.PI - 0.5; 
                        } else {
                            if(z.mesh.getObjectByName('leftArm')) z.mesh.getObjectByName('leftArm').rotation.x = Math.PI - 0.5;
                            if(z.mesh.getObjectByName('rightArm')) z.mesh.getObjectByName('rightArm').rotation.x = Math.PI - 0.5;
                        }


                        if (gameTime > z.attackTimer) {
                            z.attackState = 'strike';
                            if (dist < attackRange) {
                                let dmg = z.isBoss ? z.rank.damage : 15;
                                if (z.equippedWeapon) {
                                    dmg = z.equippedWeapon.damage;
                                }
                                takeDamage(dmg, z); 
                                if (z.equippedWeapon && z.equippedWeapon.bleed) {
                                    applyBleed(z, z.equippedWeapon.damage * z.equippedWeapon.bleed);
                                }
                            }
                            z.attackTimer = gameTime + 500; 
                        }
                    } else if (z.attackState === 'strike') {
                        if (z.weaponMesh) {
                            if (z.equippedWeapon.type === 'spear') z.weaponMesh.position.z = -0.5; 
                            else z.weaponMesh.rotation.x = Math.PI / 2 + 0.3; 
                        } else {
                            if(z.mesh.getObjectByName('leftArm')) z.mesh.getObjectByName('leftArm').rotation.x = 0;
                            if(z.mesh.getObjectByName('rightArm')) z.mesh.getObjectByName('rightArm').rotation.x = 0;
                        }

                        if (gameTime > z.attackTimer) {
                            z.attackState = 'chase';
                            if (z.weaponMesh && z.equippedWeapon.type === 'spear') z.weaponMesh.position.z = 0.2;
                        }
                    }
                } else { z.body.velocity.set(0, z.body.velocity.y, 0); }
            }
            updateProjectiles(delta);
            updatePersistentEffects(delta);
            updateSkillCooldowns();
            updateActiveUltimates(delta);
            renderer.render(scene, camera);
            lastTime = time;
        }

        function handleKeyPress(key) {
            const getOwned = (type) => Object.keys(player.ownedItems).filter(k => weapons[k].type === type);
            if (key === '1') {
                 const list = [...getOwned('sword'), ...getOwned('katana'), ...getOwned('spear')];
                 if (list.length > 0) switchWeapon(list[list.length - 1]); else switchWeapon('fist_common');
            }
            if (key === '2') {
                 const list = getOwned('bow');
                 if (list.length > 0) switchWeapon(list[list.length - 1]);
            }
            if (key === '3') {
                 const list = getOwned('gun');
                 if (list.length > 0) switchWeapon(list[list.length - 1]);
            }

            if (key==='q') useSkill(0); if (key==='e') useSkill(1); if (key==='r') useSkill(2); if (key==='f') useSkill(3);

        function handlePlayerMovement(delta) {
            const pg = player.mesh.parent; player.isMoving = false;
            
            if (mouse.y !== 0) {
                 player.cameraPivot.rotation.x -= mouse.y * 0.002;
                 player.cameraPivot.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, player.cameraPivot.rotation.x));
                 mouse.y = 0;
            }
            if (mouse.x !== 0) { 
                 pg.rotation.y -= mouse.x * 0.002; 
                 mouse.x=0; 
            }
            player.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), pg.rotation.y);

            const md = new THREE.Vector3();
            if (keysPressed['w']) { md.z-=1; player.isMoving=true; } if (keysPressed['s']) { md.z+=1; player.isMoving=true; }
            if (keysPressed['a']) { md.x-=1; player.isMoving=true; } if (keysPressed['d']) { md.x+=1; player.isMoving=true; }
            
            if (gameTime < player.dashUntil) {
                if (player.isPhaseShifting) {
                     createMasteryVisuals('dash', player.body.position, pg.quaternion);
                     for (let i=0; i<zombies.length; i++) {
                         if (player.body.position.distanceTo(zombies[i].body.position) < 1.5) damageZombie(zombies[i], 100); 
                     }
                }
                return;
            }
            if (player.isMoving) { 
                md.normalize(); 
                md.applyQuaternion(pg.quaternion); 
                const moveSpeed = 18 * player.moveSpeedMultiplier;
                player.body.velocity.x = md.x*moveSpeed; player.body.velocity.z = md.z*moveSpeed; 
            }
            else { player.body.velocity.x = 0; player.body.velocity.z = 0; }
        }
        function updatePlayerAnimations(t, dt) {
            const torso=player.mesh.getObjectByName('torso'), head=player.mesh.getObjectByName('head'), lArm=player.mesh.getObjectByName('leftArm'), rArm=player.mesh.getObjectByName('rightArm'), lLeg=player.mesh.getObjectByName('leftLeg'), rLeg=player.mesh.getObjectByName('rightLeg');

            torso.rotation.y=0; 

            head.rotation.x = player.cameraPivot.rotation.x * 0.5;

            if (player.hasBloodlust) {

            }

            if (player.ultimateAnim.active) {

                        if(p<0.2) player.mesh.scale.set(1-p*4, 1+p*2, 1-p*4);

                        else player.mesh.visible = false; 
                        if (p>0.8) player.mesh.visible = true;
                        break;
                    case 'resurrection':
                        player.mesh.position.y = -1.0 + Math.sin(p * Math.PI)*2; 
                        lArm.rotation.z = Math.PI - 0.3; rArm.rotation.z = -(Math.PI - 0.3); 
                        head.rotation.x = -0.5;
                        break;
                    case 'meteorShower':

                         player.mesh.rotation.y += dt * 5;

                    case 'undyingRage':
                         if(p<0.3) { 
                             torso.rotation.x = -0.5; head.rotation.x = -0.5;
                             lArm.rotation.x = -2; rArm.rotation.x = -2;
                             lArm.rotation.z = 0.5; rArm.rotation.z = -0.5;
                         }
                         break;
                }
                if (p>=1.0) { 
                     player.ultimateAnim.active=false; 
                     player.mesh.position.y=-1.0; 
                     player.mesh.scale.set(1,1,1); 
                     player.mesh.rotation.y = 0;
                     player.mesh.visible = true;
                }
                return; 
            }

            if (player.skillAnim.active) {
                player.skillAnim.time += dt; const p = Math.min(player.skillAnim.time/player.skillAnim.duration, 1.0);
                switch(player.skillAnim.type) {
                    case 'dash': torso.rotation.x=0.5; head.rotation.x=-0.3; lArm.rotation.x=1.0; rArm.rotation.x=1.0; lLeg.rotation.x=-0.8; rLeg.rotation.x=0.5; break;
                    case 'heal': lArm.rotation.z=Math.PI-0.5; rArm.rotation.z=-(Math.PI-0.5); head.rotation.x=-0.5; break;
                    case 'stomp': case 'iceNova': if(p<0.5){ player.mesh.position.y=THREE.MathUtils.lerp(0,1.5,p*2); lLeg.rotation.x=-0.5; rLeg.rotation.x=-0.5; lArm.rotation.x=-2.5; rArm.rotation.x=-2.5; } else { player.mesh.position.y=THREE.MathUtils.lerp(1.5,0,(p-0.5)*2); torso.rotation.x=0.5; lArm.rotation.x=-0.5; rArm.rotation.x=-0.5; } break;
                    case 'fireball': rArm.rotation.x=-Math.PI/2 + player.cameraPivot.rotation.x; torso.rotation.y=-0.5; break;
                }
                if (p>=1.0 && player.skillAnim.type!=='dash') { player.skillAnim.active=false; player.mesh.position.y=-1.0; torso.rotation.set(0,0,0); }
                if (player.skillAnim.type==='dash' && gameTime > player.dashUntil) { player.skillAnim.active=false; torso.rotation.x=0; head.rotation.x=0; }
                return;
            }
            if (player.isMoving) { const a = Math.sin(t*15)*0.5; lLeg.rotation.x=a; rLeg.rotation.x=-a; if(!player.attackState.active){ lArm.rotation.x=-a; rArm.rotation.x=a; } }
            
            const wType = weapons[player.currentWeapon].type;
            if (player.attackState.active && player.weaponMesh) {
                player.attackState.time += dt; const p = Math.min(player.attackState.time/player.attackState.duration, 1.0);
                
                if (wType === 'sword' || wType === 'katana') {
                    const bx=-Math.PI/2-0.2, by=-0.3, bz=0.4;
                    if(p<0.2) { const pp=p/0.2; player.weaponMesh.rotation.set(THREE.MathUtils.lerp(bx, -Math.PI/2+0.5, pp), THREE.MathUtils.lerp(by, -1.2, pp), THREE.MathUtils.lerp(bz, 0.8, pp)); }
                    else if(p<0.6) { const pp=(p-0.2)/0.4, ep=pp*(2-pp); player.weaponMesh.rotation.set(THREE.MathUtils.lerp(-Math.PI/2+0.5, -Math.PI/2-0.5, ep), THREE.MathUtils.lerp(-1.2, 1.5, ep), THREE.MathUtils.lerp(0.8, -0.5, ep)); }
                    else { const pp=(p-0.6)/0.4; player.weaponMesh.rotation.set(THREE.MathUtils.lerp(-Math.PI/2-0.5, bx, pp), THREE.MathUtils.lerp(1.5, by, pp), THREE.MathUtils.lerp(-0.5, bz, pp)); }
                } else if (wType === 'spear') {
                     player.weaponMesh.position.z = -0.5 - Math.sin(p * Math.PI) * 1.0; 
                } else if (wType === 'fist') {
                    player.weaponMesh.position.z = player.attackState.startPos.z + (p<0.3 ? THREE.MathUtils.lerp(0, -0.8, p/0.3) : THREE.MathUtils.lerp(-0.8, 0, (p-0.3)/0.7));
                } else if (wType === 'bow' || wType === 'gun') {
                     const pitch = player.cameraPivot.rotation.x;
                     lArm.rotation.x = -Math.PI/2 + pitch; rArm.rotation.x = -Math.PI/2 + pitch;
                     player.weaponMesh.rotation.x = pitch + (wType==='gun' ? -Math.sin(p*Math.PI)*0.2 : 0); 
                }
                if (p>=1.0) { 
                    player.attackState.active=false; 
                    if(wType==='sword' || wType==='katana') player.weaponMesh.rotation.set(-Math.PI/2-0.2, -0.3, 0.4); 
                    if(wType==='fist' || wType==='spear') player.weaponMesh.position.copy(player.attackState.startPos); 
                }
            } else if (wType === 'bow' || wType === 'gun') {
                 const pitch = player.cameraPivot.rotation.x;
                 lArm.rotation.x = -Math.PI/2 + pitch; rArm.rotation.x = -Math.PI/2 + pitch;
                 if(wType==='bow') player.weaponMesh.rotation.set(pitch, 0, Math.PI/2);
                 else player.weaponMesh.rotation.set(pitch, 0, 0);
            }
        }
        function switchWeapon(name) {
            if (!weapons[name] || player.currentWeapon===name && player.weaponMesh) return;
            player.currentWeapon = name; const wd = weapons[name], pg = player.mesh.parent;
            if (player.weaponMesh) pg.remove(player.weaponMesh);
            player.weaponMesh = wd.createMesh(); weaponNameEl.innerText = wd.name;
            
            reticleEl.style.display = 'block';

            if (wd.type === 'sword' || wd.type === 'katana') { 
                player.weaponMesh.position.set(0.7, 0.1, -0.4); 
                player.weaponMesh.rotation.set(-Math.PI/2-0.2, -0.3, 0.4); 
            } else if (wd.type === 'spear') {
                 player.weaponMesh.position.set(0.5, 0, -0.5);
                 player.weaponMesh.rotation.set(-Math.PI/2, 0, 0);
            } else if (wd.type === 'bow') { 
                player.weaponMesh.position.set(0, 1.3, 0.2); player.weaponMesh.rotation.set(0,0,Math.PI/2); 
            } else if (wd.type === 'gun') {
                 player.weaponMesh.position.set(0.3, 1.2, 0.3); player.weaponMesh.rotation.set(0,0,0);
            } else { 
                player.weaponMesh.position.set(0, 0.5, -0.75); 
                player.weaponMesh.rotation.set(0, 0, 0); 
            }
            camera.rotation.set(0,0,0); 
            updateCameraPosition(); 
            pg.add(player.weaponMesh);
        }
        function lockChangeAlert() {
            const menu = skillChoiceUI.style.display==='block' || skillReplaceUI.style.display==='block' || messageBox.style.display==='block' || shopUI.style.display==='block' || cheatConsole.style.display==='block';
            if (document.pointerLockElement===canvas) {

                    reticleEl.style.display = 'block';

        function attack() {
            if (player.attackCooldown || player.attackState.active) return;
            const wd = weapons[player.currentWeapon]; player.attackCooldown=true;
            player.attackState.active=true; player.attackState.time=0; player.attackState.duration=(wd.cooldown/1000)/player.attackSpeedMultiplier;
            player.attackState.startRot=player.weaponMesh.rotation.y; player.attackState.startPos.copy(player.weaponMesh.position);
            
            if (wd.type === 'bow' || wd.type === 'gun') {
                createProjectileWeapon(wd);
            } else { 
                // --- GODLY PASSIVE: Spatial Rend (Vacuum Wave) ---
                if (player.currentWeapon === 'katana_godly') {
                    const pg = player.mesh.parent;
                    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(pg.quaternion);
                    const wavePos = pg.position.clone().add(new THREE.Vector3(0, 1, 0));
                    createVacuumWave(wavePos, fwd);
                }
                
                const pg=player.mesh.parent, pos=pg.position.clone(), fwd=new THREE.Vector3(0,0,-1).applyQuaternion(pg.quaternion); pos.addScaledVector(fwd, wd.range/2);
                let hitCount = 0;
                for (let i=zombies.length-1; i>=0; i--) {
                    const z = zombies[i];
                    if (!z || !z.body) continue;
                    
                    if (wd.type === 'spear' && hitCount >= wd.pierce) continue;

                    const hitDist = wd.range + (z.isBoss ? z.rank.scale * 0.5 : 0);
                    if (pos.distanceTo(z.body.position) < hitDist) {
                        if (wd.type === 'spear') {
                             const toZ = z.body.position.vsub(player.body.position); toZ.normalize();
                             if (fwd.dot(new THREE.Vector3(toZ.x, 0, toZ.z)) < 0.9) continue; 
                        }

                        damageZombie(z, wd.damage * player.damageMultiplier, wd);
                        hitCount++;
                        
                        if (wd.bleed) applyBleed(z, wd.damage * wd.bleed * player.damageMultiplier);
                        if (wd.lifesteal) {
                            const heal = wd.damage * player.damageMultiplier * wd.lifesteal;
                            player.health = Math.min(player.maxHealth, player.health + heal);
                            updateHUD();
                        }
                        if (wd.cleave) {
                             for(let j=zombies.length-1; j>=0; j--) {
                                 if(i===j) continue;
                                 const z2 = zombies[j];
                                 if (z2 && z2.body && z.body.position.distanceTo(z2.body.position) < 3.0) {
                                      damageZombie(z2, wd.damage * wd.cleave * player.damageMultiplier, wd); 
                                 }
                             }
                        }

                        if (z.health > 0) {
                            const kb=new CANNON.Vec3(); z.body.position.vsub(player.body.position, kb); kb.y=0.2; kb.normalize();
                            const kbForce = (wd.type==='spear'?40 : 25) * (z.isBoss ? 0.1 : 1.0);
                            z.body.applyImpulse(kb.scale(kbForce), z.body.position);
                        }
                    }
                }
            }
            setTimeout(() => { player.attackCooldown=false; }, wd.cooldown/player.attackSpeedMultiplier);
        }
        
        function createVacuumWave(pos, dir) {
            const geo = new THREE.CylinderGeometry(2, 2, 0.5, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
            mesh.rotateX(Math.PI/2); // Flatten it relative to direction
            scene.add(mesh);
            
            projectiles.push({ 
                mesh: mesh, dir: dir, speed: 40, damage: 5000 * player.damageMultiplier, 
                life: 60, isVacuumWave: true, weapon: weapons['katana_godly'] 
            });
        }

        function createProjectileWeapon(wd) {
             const isGun = wd.type === 'gun';
             const isGodlyBow = wd.name === 'Fallen of Heaven';
             
             let geo, mat;
             if (isGodlyBow) {
                 geo = new THREE.SphereGeometry(0.5, 16, 16); // Black Hole
                 mat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x330000 });
             } else {
                 geo = isGun ? new THREE.SphereGeometry(0.1, 8, 8) : new THREE.CylinderGeometry(0.02, 0.02, 0.8, 8);
                 mat = new THREE.MeshBasicMaterial({color: isGun ? 0xffff00 : 0xeeeeee});
             }
             
             const mesh = new THREE.Mesh(geo,mat); 
             
             const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
             const start = new THREE.Vector3(); camera.getWorldPosition(start); start.addScaledVector(dir, 0.5); 

             mesh.position.copy(start);
             if (!isGun && !isGodlyBow) {
                 mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
                 mesh.rotateX(Math.PI/2);
             }

             scene.add(mesh);
             projectiles.push({ mesh:mesh, dir:dir, speed: wd.projSpeed, damage:wd.damage * player.damageMultiplier, life:150, isArrow: !isGun, isBullet: isGun, isBlackHole: isGodlyBow, weapon: wd });
        }
        function applyBleed(z, totalDamage) {
             if (!z.bleed) z.bleed = { damagePerTick: totalDamage / 6, ticksLeft: 6, timer: 0 }; 
             else { z.bleed.damagePerTick += totalDamage / 6; z.bleed.ticksLeft = 6; }
        }
        function damageZombie(z, amt, weapon) {
            if (!z || z.health <= 0) return;
            
            if (weapon && weapon.crit && Math.random() < weapon.crit) {
                 amt *= 3; 
                 createParticles(z.body.position, 0xff0000, 20); 
            }

            if (z.isBrittle) amt *= 2; 
            z.health -= amt;
            
            if (z.isBoss) {
                bossHealthBar.style.width = Math.max(0, (z.health / z.maxHealth) * 100) + '%';
            }

            if (player.hasBloodlust) { 
                 player.health = Math.min(player.maxHealth, player.health + (amt * 0.2)); 
                 updateHUD();
            }
            if (z.mesh && !z.isFrozen) { 
                setEntityColor(z.mesh, 0xffffff); 
                setTimeout(() => { if(z.mesh && !z.isFrozen && z.health>0) setEntityColor(z.mesh, z.isBoss ? z.rank.color : (z.isGolden ? 0xffd700 : 0x44cc44)); }, 100); 
            }
            if (z.health <= 0) killZombie(z, zombies.indexOf(z));
        }
        function takeDamage(amt, sourceZombie) {
            if (player.isDead || player.isPhaseShifting || player.isUndying) return; 
            
            amt *= (1.0 - player.damageReduction); 
            
            player.health -= amt; if (player.health<0) player.health=0;
            setEntityColor(player.mesh, 0xff0000); setTimeout(() => { if(!player.isDead) setEntityColor(player.mesh, 0x0077ff); }, 100);
            updateHUD(); 

            if (sourceZombie && player.currentArmor && armors[player.currentArmor].thorns) {
                 damageZombie(sourceZombie, amt * armors[player.currentArmor].thorns / (1.0 - player.damageReduction)); 
            }

            if (player.health<=0) die();
        }
        function setEntityColor(g, c) { if (!g || !g.children) return; g.children.forEach(p => { if(p.geometry && p.geometry.parameters.width>0.15) p.material.color.set(c); }); }
        function die() { player.isDead=true; gamePaused=true; messageBox.style.display='block'; document.exitPointerLock(); }
        function killZombie(z, idx) { 
            createParticles(z.group.position, z.isBoss ? z.rank.color : (z.isGolden ? 0xffd700 : 0x00ff00), z.isBoss ? 100 : 20); 
            scene.remove(z.group); world.removeBody(z.body); 
            zombies.splice(idx, 1); 
            
            if (z.isBoss) {
                bossActive = false;
                currentBoss = null;
                bossHud.style.display = 'none';
                setSpawnInterval(); 
                player.coins += z.rank.coins;
            } else if (z.isGolden) {
                player.coins += 500;
            } else {
                player.coins += 10;
            }

            killCount++; killCountEl.innerText=killCount; gainXP(z.xpValue); updateHUD();
        }
        
        function createProjectile(skill, level) {
            const pg=player.mesh.parent, geo=new THREE.SphereGeometry(0.3,8,8), mat=new THREE.MeshBasicMaterial({color:0xff4500}), mesh=new THREE.Mesh(geo,mat);
            const scale = 1.0 + (level * 0.2); 
            mesh.scale.set(scale, scale, scale);
            
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
            const start = new THREE.Vector3(); player.cameraPivot.getWorldPosition(start); start.addScaledVector(dir, 2.0);

            mesh.position.copy(start); scene.add(mesh);
            projectiles.push({ mesh:mesh, dir:dir, speed:15+(level*1), damage:100+(level*30)*player.damageMultiplier, life:100, isInferno: level>=5 });
        }
        
        function createMasteryVisuals(type, pos, rot) {
            if (type === 'dash') {
                const geo = player.mesh.getObjectByName('torso').geometry.clone();
                const mat = new THREE.MeshBasicMaterial({ color: 0x0000ff, transparent: true, opacity: 0.3 });
                const trail = new THREE.Mesh(geo, mat);
                trail.position.copy(pos); trail.position.y += 1.25; trail.quaternion.copy(rot);
                scene.add(trail);
                let life = 10;
                const anim = () => { life--; trail.material.opacity = life/20; if(life<=0) scene.remove(trail); else requestAnimationFrame(anim); };
                anim();
            } else if (type === 'heal') {
                const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 15, 32), new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));
                ring.position.copy(pos); ring.position.y = 0.2; ring.rotation.x = -Math.PI/2;
                scene.add(ring);
                let s = 1;
                const anim = () => { s+=1; ring.scale.set(s,s,s); ring.material.opacity -= 0.05; if(ring.material.opacity<=0) scene.remove(ring); else requestAnimationFrame(anim); };
                anim();
            } else if (type === 'stomp') {
                 for(let i=0; i<8; i++) {
                     const debris = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x555555 }));
                     debris.position.copy(pos); debris.position.y = 0.5;
                     const angle = (i/8)*Math.PI*2; const dist = Math.random()*5 + 5;
                     debris.position.x += Math.sin(angle) * 2; debris.position.z += Math.cos(angle) * 2;
                     scene.add(debris);
                     let life = 30;
                     const anim = () => {
                         life--; debris.position.x += Math.sin(angle)*0.2; debris.position.z += Math.cos(angle)*0.2; debris.position.y += 0.1; debris.rotation.x += 0.1;
                         if(life<=0) scene.remove(debris); else requestAnimationFrame(anim);
                     };
                     anim();
                 }
            }
        }

        function createLightningStrike(pos) {
            // Flash
            const flash = new THREE.PointLight(0xFF0000, 10, 20);
            flash.position.copy(pos); flash.position.y += 5;
            scene.add(flash);
            setTimeout(()=>scene.remove(flash), 200);

            // Beam
            const geo = new THREE.CylinderGeometry(0.5, 0.5, 40, 8);
            const mat = new THREE.MeshBasicMaterial({ color: 0xFF0000, transparent: true, opacity: 0.8 });
            const beam = new THREE.Mesh(geo, mat);
            beam.position.set(pos.x, 20, pos.z);
            scene.add(beam);
            setTimeout(()=>scene.remove(beam), 300);

            // Impact
            createParticles(pos, 0xFF0000, 50);
            
            // AOE Damage
            for(let i=zombies.length-1; i>=0; i--) {
                const z = zombies[i];
                if (z && z.body && z.body.position.distanceTo(new CANNON.Vec3(pos.x, pos.y, pos.z)) < 10) {
                    damageZombie(z, 2000 * player.damageMultiplier); // Judgment Damage
                    z.isFrozen = true; z.freezeUntil = gameTime + 500; // Stun
                }
            }
        }

        function updateProjectiles(dt) {
            for (let i=projectiles.length-1; i>=0; i--) {
                const p=projectiles[i];
                if (!p || !p.mesh) {
                    projectiles.splice(i, 1);
                    continue;
                }
                const mv=p.dir.clone().multiplyScalar(p.speed*dt); p.mesh.position.add(mv); p.life--;
                
                if (p.isInferno && p.life % 5 === 0) {
                     createParticles(p.mesh.position, 0x555555, 2);
                }

                if (p.isVacuumWave) {
                    p.mesh.rotation.y += 0.2; // Spin visual
                    for (let j=zombies.length-1; j>=0; j--) {
                        const z = zombies[j];
                        if (!z || !z.body) continue;
                        if (p.mesh.position.distanceTo(z.body.position) < 3.0) {
                            // Vacuum Wave hits many times as it passes, moderate damage per tick or use invuln timer?
                            // For simplicity, just damage. It flies fast so multiple hits are rare unless big zombie.
                            damageZombie(z, 100 * player.damageMultiplier, p.weapon); 
                            if (p.weapon.lifesteal) {
                                player.health = Math.min(player.maxHealth, player.health + (100 * player.damageMultiplier * p.weapon.lifesteal));
                                updateHUD();
                            }
                        }
                    }
                    if (p.life <= 0) { scene.remove(p.mesh); projectiles.splice(i, 1); }
                    continue;
                }

                if (p.isSuperMeteor) {
                     if (p.mesh.position.y <= 0) { 
                         createParticles(p.mesh.position, 0xff4500, 300); 
                         for(let j=zombies.length-1; j>=0; j--) {
                             if(zombies[j] && zombies[j].body && p.mesh.position.distanceTo(zombies[j].body.position) < 15) {
                                 damageZombie(zombies[j], 2000);
                             }
                         }
                         createVolcano(p.mesh.position);
                         scene.remove(p.mesh); projectiles.splice(i, 1);
                         continue;
                     }
                }

                if (p.isBossMeteor && p.mesh.position.y <= 0) {
                    createParticles(p.mesh.position, 0xff4500, 100);
                    if (p.mesh.position.distanceTo(player.body.position) < 5) {
                        takeDamage(p.damage, null); 
                    }
                    scene.remove(p.mesh); projectiles.splice(i, 1);
                    continue;
                }

                let hit=false;
                if (!p.isSuperMeteor && !p.isVolcanoMeteor && !p.isBossMeteor && !p.isVacuumWave) {
                    for (let j=zombies.length-1; j>=0; j--) {
                        const z = zombies[j];
                        if (!z || !z.body) continue;
                        const hitRad = (p.isArrow || p.isBullet || p.isBlackHole ? 1.0 : 2.0) + (z.isBoss ? z.rank.scale * 0.5 : 0);
                        if (p.mesh.position.distanceTo(z.body.position) < hitRad) {
                            damageZombie(z, p.damage, p.weapon);
                            hit=true;
                            if (p.isBlackHole) {
                                createLightningStrike(p.mesh.position);
                            }
                            if (p.weapon && p.weapon.ricochet && p.weapon.ricochet > 0) {
                                 p.weapon.ricochet--;
                                 let closest = null, minDist = 10;
                                 for(let k=0; k<zombies.length; k++) {
                                      if(zombies[k] === z) continue;
                                      const d = p.mesh.position.distanceTo(zombies[k].body.position);
                                      if(d < minDist) { minDist = d; closest = zombies[k]; }
                                 }
                                 if (closest) {
                                      const closestPos = new THREE.Vector3(closest.body.position.x, closest.body.position.y, closest.body.position.z);
                                      p.dir = closestPos.sub(p.mesh.position).normalize();
                                      p.life += 20; 
                                      hit = false; 
                                 }
                            }
                            break; 
                        }
                    }
                }
                
                if (p.isVolcanoMeteor && p.mesh.position.y <= 0) {
                    createParticles(p.mesh.position, 0xff4500, 50);
                    for(let j=zombies.length-1; j>=0; j--) {
                         if(zombies[j] && zombies[j].body && p.mesh.position.distanceTo(zombies[j].body.position) < 5) {
                             damageZombie(zombies[j], 500);
                         }
                     }
                    hit = true;
                }

                if (hit || p.life<=0) {
                    if (!p.isArrow && !p.isBullet && !p.isVolcanoMeteor && !p.isBossMeteor) createParticles(p.mesh.position, 0xff4500, 30);
                    if (hit && p.isInferno) createFireCircle(p.mesh.position); 
                    scene.remove(p.mesh); projectiles.splice(i, 1);
                }
            }
        }
        function createFireCircle(pos) {
            const g=new THREE.RingGeometry(0.1, 5, 32), m=new THREE.MeshBasicMaterial({ color: 0xff5500, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
            const mesh=new THREE.Mesh(g, m); mesh.rotation.x = -Math.PI/2; mesh.position.copy(pos); mesh.position.y=0.1; scene.add(mesh);
            persistentEffects.push({ type:'fireCircle', mesh:mesh, position:pos, radius:5, duration:5000, damagePerTick:50, tickTimer:0 });
        }
        function createVolcano(pos) {
             const g = new THREE.ConeGeometry(3, 4, 16), m = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
             const volcano = new THREE.Mesh(g, m); volcano.position.copy(pos); volcano.position.y = 2; scene.add(volcano);
             persistentEffects.push({ type:'volcano', mesh:volcano, position:pos, duration:10000, nextErupt: 0 });
        }

        function updatePersistentEffects(dt) {
            for(let i=persistentEffects.length-1; i>=0; i--) {
                const e=persistentEffects[i]; e.duration -= dt*1000;
                if(e.type==='fireCircle') {
                    e.tickTimer+=dt; if(e.tickTimer>0.5) { e.tickTimer=0; for(let j=0; j<zombies.length; j++) if(zombies[j].body.position.distanceTo(e.position)<e.radius) damageZombie(zombies[j], e.damagePerTick); }
                }
                if (e.type === 'blizzardAura') {
                     e.mesh.position.copy(player.body.position); e.mesh.position.y = 0.1;
                     e.mesh.rotation.z += dt * 2; 
                }
                if (e.type === 'bossBeam') {
                    const boss = e.boss;
                    if (boss.isDead || boss.health <= 0) { e.duration = 0; } 
                    
                    const playerPos = player.body.position;
                    const bossPos = boss.body.position;
                    const dirToPlayer = new THREE.Vector3().subVectors(new THREE.Vector3(playerPos.x, playerPos.y, playerPos.z), new THREE.Vector3(bossPos.x, bossPos.y, bossPos.z));
                    const dist = dirToPlayer.length();
                    dirToPlayer.normalize();

                    e.mesh.position.copy(new THREE.Vector3(bossPos.x, bossPos.y, bossPos.z)).addScaledVector(dirToPlayer, dist / 2).add(new THREE.Vector3(0, 1, 0));
                    e.mesh.scale.y = dist;
                    e.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirToPlayer);

                    e.tickTimer += dt;
                    if (e.tickTimer > 0.2) { 
                        e.tickTimer = 0;
                        takeDamage(e.damagePerTick, boss);
                        boss.health = Math.min(boss.maxHealth, boss.health + e.healPerTick);
                        if (boss.health > boss.maxHealth) boss.health = boss.maxHealth;
                        createParticles(playerPos, 0x880000, 10); 
                        createParticles(bossPos, 0x00ff00, 5); 
                    }
                }
                if (e.type === 'volcano' && gameTime > e.nextErupt) {
                     e.nextErupt = gameTime + 500; 
                     const startPos = e.position.clone().add(new THREE.Vector3(0, 4, 0));
                     const targetPos = e.position.clone().add(new THREE.Vector3((Math.random()-0.5)*20, 0, (Math.random()-0.5)*20));
                     const skyPos = targetPos.clone().add(new THREE.Vector3(0, 30, 0));
                     const fallDir = new THREE.Vector3(0, -1, 0);
                     const geo = new THREE.SphereGeometry(0.6, 8, 8), mat = new THREE.MeshStandardMaterial({ color: 0xff4500, emissive: 0xff2200 });
                     const vMeteor = new THREE.Mesh(geo, mat); vMeteor.position.copy(skyPos); scene.add(vMeteor);
                     projectiles.push({ mesh:vMeteor, dir:fallDir, speed:30, damage:500, life:200, isVolcanoMeteor:true });
                }
                if(e.duration<=0) { scene.remove(e.mesh); persistentEffects.splice(i,1); }
            }
        }

        function spawnBoss(rank) {
            if (bossActive) return;
            bossActive = true;
            clearInterval(spawnIntervalId); 

            const scale = rank.scale;
            const b = new CANNON.Body({ mass: 500 * scale, material: zombieMaterial, fixedRotation: true, linearDamping: 0.8 });
            b.addShape(new CANNON.Box(new CANNON.Vec3(0.4 * scale, 1 * scale, 0.4 * scale)));
            b.position.set(0, 5 * scale, -30); 
            world.addBody(b);

            const zm = createHumanoidMesh(rank.color, false); // Base mesh
            
            // --- REFINED BOSS MODELS ---
            decorateBoss(zm, rank.name);
            
            zm.scale.set(scale, scale, scale);
            const zg = new THREE.Group(); zg.add(zm); scene.add(zg);

            const boss = { 
                group: zg, mesh: zm, body: b, 
                health: rank.hp, maxHealth: rank.hp, xpValue: rank.xp, 
                baseSpeed: 2 + (rank.level / 10), 
                isFrozen: false, freezeUntil: 0, isBrittle: false,
                isBoss: true, rank: rank,
                attackState: 'chase', attackTimer: 0,
                skillCooldown: 0, 
                equippedWeapon: null, weaponMesh: null 
            };
            zombies.push(boss);
            currentBoss = boss;

            bossNameEl.innerText = "BOSS " + rank.name;
            bossNameEl.style.color = '#' + rank.color.toString(16).padStart(6, '0');
            bossHealthBar.style.width = '100%';
            bossHealthBar.style.backgroundColor = '#' + rank.color.toString(16).padStart(6, '0');
            bossHud.style.display = 'block';
        }

        function decorateBoss(mesh, rankName) {
            const head = mesh.getObjectByName('head');
            const torso = mesh.getObjectByName('torso');
            const lArm = mesh.getObjectByName('leftArm');
            const rArm = mesh.getObjectByName('rightArm');
            const matDark = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const matGlow = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 });
            const matGold = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.8 });

            if (rankName.includes('C')) { // Horns & Shoulder Pads
                const lHorn = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.6, 6), matDark);
                lHorn.position.set(-0.2, 0.3, 0); lHorn.rotation.z = -0.5; head.add(lHorn);
                const rHorn = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.6, 6), matDark);
                rHorn.position.set(0.2, 0.3, 0); rHorn.rotation.z = 0.5; head.add(rHorn);
            } else if (rankName.includes('B')) { // Giant Arms & Core
                lArm.scale.set(1.8, 1.4, 1.8); rArm.scale.set(1.8, 1.4, 1.8);
                const core = new THREE.Mesh(new THREE.SphereGeometry(0.2), matGlow);
                core.position.set(0, 0, 0.2); torso.add(core);
            } else if (rankName.includes('A')) { // Spikes everywhere
                for(let i=0; i<8; i++) {
                    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.5, 4), new THREE.MeshStandardMaterial({color:0xeeeeee}));
                    spike.position.set((Math.random()-0.5), (Math.random()-0.5), -0.25);
                    spike.rotation.set(Math.random()*3, Math.random()*3, 0);
                    torso.add(spike);
                }
            } else if (rankName.includes('S')) { // Wings & Halo
                const wingGeo = new THREE.BoxGeometry(0.1, 2.0, 1.5);
                const lWing = new THREE.Mesh(wingGeo, matDark); lWing.position.set(-0.5, 0.5, 0.5); lWing.rotation.set(0.5, -0.5, 0); torso.add(lWing);
                const rWing = new THREE.Mesh(wingGeo, matDark); rWing.position.set(0.5, 0.5, 0.5); rWing.rotation.set(0.5, 0.5, 0); torso.add(rWing);
                const halo = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 8, 16), matGlow); halo.position.y = 0.8; halo.rotation.x = Math.PI/2; head.add(halo);
            } else if (rankName.includes('SS')) { // Crown & Cape
                 const crown = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.1, 4, 8), matGold);
                 crown.position.y = 0.6; crown.rotation.x = -0.2; head.add(crown);
                 const cape = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.5, 0.1), new THREE.MeshStandardMaterial({color:0x550000}));
                 cape.position.set(0, -0.5, 0.4); cape.rotation.x = 0.2; torso.add(cape);
            } else if (rankName.includes('SSS')) { // Aura & Floating Bits
                const aura = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 }));
                torso.add(aura);
                for(let i=0; i<4; i++) {
                    const bit = new THREE.Mesh(new THREE.OctahedronGeometry(0.3), matGlow);
                    bit.position.set(Math.sin(i*1.5)*2, Math.cos(i*1.5)*2, 0);
                    torso.add(bit);
                }
            }
        }

        function useBossSkill(boss) {
            const rank = boss.rank.name;
            const bossPos = boss.body.position;
            const playerPos = player.body.position;
            const dirToPlayer = new CANNON.Vec3();
            playerPos.vsub(bossPos, dirToPlayer);
            dirToPlayer.y = 0;
            dirToPlayer.normalize();

            const lArm = boss.mesh.getObjectByName('leftArm');
            const rArm = boss.mesh.getObjectByName('rightArm');
            if (lArm) lArm.rotation.x = -Math.PI / 2;
            if (rArm) rArm.rotation.x = -Math.PI / 2;
            
            boss.body.velocity.set(0, boss.body.velocity.y, 0);

            if (rank.includes('C')) {
                createParticles(bossPos, 0xff6600, 30);
                boss.body.velocity.x = dirToPlayer.x * 30; 
                boss.body.velocity.z = dirToPlayer.z * 30;
                setTimeout(() => {
                    if (boss.isDead) return;
                    if (boss.body.position.distanceTo(player.body.position) < 3 * boss.rank.scale) {
                        takeDamage(boss.rank.damage * 1.5, boss);
                    }
                }, 500); 
            } else if (rank.includes('B')) {
                createParticles(bossPos, 0xff0000, 50);
                boss.body.velocity.y = 10; 
                setTimeout(() => {
                    if (boss.isDead) return;
                    boss.body.velocity.y = -30; 
                    setTimeout(() => {
                        if (boss.isDead) return;
                        createParticles(bossPos, 0x8B4513, 100); 
                        if (bossPos.distanceTo(playerPos) < 8) {
                            takeDamage(boss.rank.damage * 2, boss);
                            const kb = new CANNON.Vec3();
                            playerPos.vsub(bossPos, kb); kb.y = 1; kb.normalize();
                            player.body.applyImpulse(kb.scale(150), player.body.position);
                        }
                    }, 400); 
                }, 300); 
            } else if (rank.includes('A')) {
                createParticles(bossPos, 0xeeeeee, 40);
                for (let i = 0; i < 5; i++) {
                    const spread = new THREE.Vector3((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.1, (Math.random() - 0.5) * 0.5);
                    const projDir = new THREE.Vector3(dirToPlayer.x, 0, dirToPlayer.z).add(spread).normalize();
                    const geo = new THREE.ConeGeometry(0.2, 0.8, 4);
                    const mat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.copy(new THREE.Vector3(bossPos.x, bossPos.y, bossPos.z)).add(new THREE.Vector3(0, 1, 0));
                    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), projDir);
                    scene.add(mesh);
                    projectiles.push({ 
                        mesh: mesh, dir: projDir, speed: 20, 
                        damage: boss.rank.damage * 0.8, 
                        life: 60, isArrow: true 
                    });
                }
            } else if (rank.includes('S')) {
                const beamGeo = new THREE.CylinderGeometry(0.2, 0.2, 1, 16, 1, true);
                const beamMat = new THREE.MeshBasicMaterial({ color: 0x880000, transparent: true, opacity: 0.7 });
                const beam = new THREE.Mesh(beamGeo, beamMat);
                beam.position.copy(new THREE.Vector3(bossPos.x, bossPos.y, bossPos.z));
                scene.add(beam);
                
                const beamEffect = { 
                    type: 'bossBeam', mesh: beam, boss: boss, duration: 2000, 
                    tickTimer: 0, damagePerTick: boss.rank.damage * 0.5,
                    healPerTick: boss.rank.damage * 2
                };
                persistentEffects.push(beamEffect);
            } else if (rank.includes('SS')) {
                createParticles(bossPos, 0x111111, 100);
                for (let i = 0; i < 3; i++) {
                    spawnMinion(bossPos);
                }
            } else if (rank.includes('SSS')) {
                createParticles(bossPos, 0xffffff, 150);
                for (let i = 0; i < 5; i++) {
                    const targetPos = playerPos.clone().add(new CANNON.Vec3((Math.random()-0.5)*20, 0, (Math.random()-0.5)*20));
                    const startPos = targetPos.clone().add(new CANNON.Vec3(0, 80, 0));
                    const dir = targetPos.clone().vsub(startPos).normalize();
                    const geo = new THREE.SphereGeometry(1.5, 16, 16);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xff4500, emissive: 0xff0000 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.copy(startPos);
                    scene.add(mesh);
                    projectiles.push({ 
                        mesh: mesh, dir: new THREE.Vector3(dir.x, dir.y, dir.z), 
                        speed: 60, damage: boss.rank.damage, 
                        life: 200, isSuperMeteor: false, isBossMeteor: true 
                    });
                }
            }
        }

        function spawnZombie() {
            if (player.isDead || gamePaused || zombies.length>=100 || bossActive) return;
            const b = new CANNON.Body({ mass: 60, material: zombieMaterial, fixedRotation: true, linearDamping: 0.5 });
            b.addShape(new CANNON.Box(new CANNON.Vec3(0.4, 1, 0.4)));
            
            const angle = Math.random() * Math.PI * 2;
            const radius = 20 + Math.random() * 45; 
            const sx = Math.sin(angle) * radius;
            const sz = Math.cos(angle) * radius;
            b.position.set(sx, 5, sz); 
            world.addBody(b);

            let isGolden = false;
            if (player.level >= 5 && Math.random() < 0.10) {
                isGolden = true;
            }

            const color = isGolden ? 0xffd700 : 0x44cc44;

        function setSpawnInterval() { if (spawnIntervalId) clearInterval(spawnIntervalId); if (currentSpawnDelay<100) currentSpawnDelay=100; spawnIntervalId=setInterval(spawnZombie, currentSpawnDelay); }
